# The documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for discord.js
  - package-ecosystem: "discord.js"
    directory: "/" # `root` directory
    schedule:
      interval: "weekly"

  # Enable version updates for dotenv
  - package-ecosystem: "dotenv"
    directory: "/" # `root` directory
    schedule:
      interval: "weekly"

  # Enable version updates for mongoose
  - package-ecosystem: "mongoose"
    directory: "/" # `root` directory
    schedule:
      interval: "weekly"

  # Enable version updates for node-cron
  - package-ecosystem: "node-cron"
    directory: "/" # `root` directory
    schedule:
      interval: "weekly"

  # Enable version updates for undici
  - package-ecosystem: "undici"
    directory: "/" # `root` directory
    schedule:
      interval: "weekly"
